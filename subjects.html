<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/config.js"></script>
<script src="js/app.js"></script>
<script>
(function(){
  App.counts(function(c){
    var box = App.el("subjectList");
    box.innerHTML = "";
    App.SUBJECTS.forEach(function(s){
      var n = c.by[s.slug] || 0;
      var a = document.createElement("a");
      a.className = "srow" + (n ? "" : " dim");
      a.href = n ? ("practice.html?subject=" + s.slug) : "subjects.html";
      if(!n) a.onclick = function(e){ e.preventDefault(); };
      a.innerHTML = '<span class="ric">' + s.icon + '</span>'
        + '<span class="rtx"><b>' + App.esc(s.name) + '</b><small>' + App.esc(s.desc) + '</small></span>'
        + '<span class="rcount' + (n ? "" : " zero") + '">' + (n ? n.toLocaleString("en-US") : "Soon") + '</span>'
        + '<span class="rchev">›</span>';
      box.appendChild(a);
    });
  });
})();
</script>
</body>
